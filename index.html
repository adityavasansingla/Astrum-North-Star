<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#D63B2E;font-family:Century Gothic,CenturyGothic,AppleGothic,sans-serif;}
.card{background:#fff;padding:40px 38px 34px;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.25);width:min(320px,86vw);text-align:center;border-top:4px solid #A52B20;}
.logo{height:36px;display:block;margin:0 auto 16px;}
h1{font-size:20px;color:#1A1A1A;margin:0 0 4px;}
.sub{font-size:10px;letter-spacing:2.5px;color:#D63B2E;margin:0 0 18px;text-transform:uppercase;}
.divider{position:relative;height:1px;background:#D63B2E;width:76px;margin:0 auto 16px;}
.divider:before,.divider:after{content:"";position:absolute;top:-2px;width:5px;height:5px;border-radius:50%;background:#D63B2E;}
.divider:before{left:-2px;}.divider:after{right:-2px;}
.date{font-size:12px;color:#888;margin:0 0 20px;white-space:nowrap;}
input{width:100%;box-sizing:border-box;padding:13px 14px;font-size:16px;border:1px solid #EEE;background:#F7F7F8;outline:none;margin-bottom:14px;border-radius:4px;}
input:focus{border-color:#D63B2E;}
button{width:100%;padding:13px;background:#D63B2E;color:#fff;border:0;font-size:13px;letter-spacing:1px;cursor:pointer;border-radius:4px;text-transform:uppercase;}
button:hover{background:#A52B20;}
#err{color:#D63B2E;font-size:12px;min-height:16px;margin-top:10px;}
#busy{color:#888;font-size:12px;min-height:16px;margin-top:10px;display:none;}
.foot{margin-top:18px;font-size:9px;letter-spacing:1.5px;color:#BBB;text-transform:uppercase;}

function b2u(b){var n=atob(b);var u=new Uint8Array(n.length);for(var i=0;i<n.length;i++)u[i]=n.charCodeAt(i);return u;}
async function go(){
  var pw=document.getElementById("pw").value;
  document.getElementById("err").textContent="";
  document.getElementById("busy").style.display="block";
  try{
    var km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b2u(SALT),iterations:600000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
    var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b2u(IV)},key,b2u(CT));
    var ds2=new DecompressionStream("gzip");var w2=ds2.writable.getWriter();w2.write(new Uint8Array(pt));w2.close();
    var r2=ds2.readable.getReader();var parts=[];
    while(true){var c=await r2.read();if(c.done)break;parts.push(c.value);}
    var n=0;for(var i=0;i<parts.length;i++)n+=parts[i].length;
    var all=new Uint8Array(n);var o=0;for(var i=0;i<parts.length;i++){all.set(parts[i],o);o+=parts[i].length;}
    var html=new TextDecoder().decode(all);
    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById("busy").style.display="none";
    document.getElementById("err").textContent="Incorrect password";
  }
}
document.getElementById("pw").addEventListener("keydown",function(e){if(e.key==="Enter")go();});
